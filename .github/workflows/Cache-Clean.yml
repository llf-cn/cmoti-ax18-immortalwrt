name: Cache-Clean

on:
  # 每周日北京时间凌晨4点（UTC 20:00）清理缓存
  schedule:
    - cron: 0 20 * * 0
  workflow_dispatch:

# 修复：最小权限原则
permissions:
  contents: read
  actions: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        # 修复：固定到具体版本，避免 @main 浮动引用
        uses: actions/checkout@v4

      - name: Cache Clean
        run: |
          # 使用 GitHub API 删除所有 Actions 缓存（兼容旧版 gh CLI）
          gh api --paginate /repos/${{ github.repository }}/actions/caches --jq '.actions_caches[] | .id' | while read id; do
            echo "删除缓存: $id"
            gh api -X DELETE "/repos/${{ github.repository }}/actions/caches/$id" --silent
          done
          echo "缓存清理完成"
